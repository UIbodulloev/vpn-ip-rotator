# Веб-админка VPN на medbot: admin.mos8.online → бот на 127.0.0.1:8787.
# Ставит ops/setup-admin-web.sh. Сертификат — Let's Encrypt (certbot).

# Не больше 30 запросов в минуту с адреса: админке хватает, переборщику — нет.
limit_req_zone $binary_remote_addr zone=vpnadmin:1m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name admin.mos8.online;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.mos8.online;

    ssl_certificate     /etc/letsencrypt/live/admin.mos8.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.mos8.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:vpnadmin_ssl:1m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log /var/log/nginx/vpn-admin.access.log;
    client_max_body_size 4k;

    location / {
        limit_req zone=vpnadmin burst=15 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
